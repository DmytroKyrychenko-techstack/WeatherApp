services:
  db-test:
    image: postgres:18-alpine
    container_name: weatherapp-db-test
    environment:
      POSTGRES_USER: weatherapp_test
      POSTGRES_PASSWORD: weatherapp_test
      POSTGRES_DB: weatherapp_test
    ports:
      - "5434:5432"
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U weatherapp_test -d weatherapp_test"]
      interval: 1s
      timeout: 5s
      retries: 10
