services:
  db:
    image: postgres:18-alpine
    container_name: weatherapp-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: weatherapp
      POSTGRES_PASSWORD: weatherapp
      POSTGRES_DB: weatherapp
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
